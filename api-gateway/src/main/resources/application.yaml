spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      routes:
        # Auth no JWT validation required
        - id: user-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**


        # User service routes - JWT required
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtAuthFilter


        # Post service routes - JWT required
        - id: post-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/posts/**
          filters:
            - name: JwtAuthFilter


        # Feed service routes - JWT required
        - id: feed-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/feeds/**
          filters:
            - name: JwtAuthFilter

        # Search service routes - JWT required
        - id: post-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/search/**
          filters:
            - name: JwtAuthFilter

server:
  port: 8080

jwt:
  secret-key:

management:
  endpoints:
    web:
      exposure:
        include: health, info