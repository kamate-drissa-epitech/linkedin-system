spring:
  application:
    name: users-service
  datasource:
    url: jdbc:mysql://localhost:3306?user_db?createIfNotExist=True
    username: root
    password:
    driver-class-name:  com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


  server:
    port: 8081

  jwt:
    secret:
    expiration:
    refresh-expiration:

  aws:
    access-key:
    secret-key:
    region:
    S3:
      bucket-name:

  management:
    endpoints:
      web:
        exposure:
          include: health,info







